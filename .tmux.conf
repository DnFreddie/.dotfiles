#--------------Base setup---------------
setw -g mouse on
setw -g mode-keys vi
set -g status-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set-window-option -g automatic-rename on
set-option -g set-titles on
set-option -g renumber-windows on
set-option -g bell-action none
set-option -g visual-bell off

set -g history-limit 10000
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
setw -g monitor-activity off
set -sg escape-time 0

#---------------Rebinds---------------
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind -n M-c select-pane -D

#floating windows
 bind-key -n -N 'Toggle popup window' M-e if-shell -F '#{==:#{session_name},popup}' {
    detach-client
} {
    display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 75% -E 'tmux attach-session -t popup || tmux new-session -s popup'
}
bind-key -n M-e if-shell -F '#{==:#{session_name},popup}' { detach-client } { display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 75% -E 'tmux attach-session -t popup || tmux new-session -s popup' }


# Reload tmux config
bind r source-file ~/.tmux.conf
bind x kill-pane

bind-key g new-window -n "goseq" "goseq new"
bind-key e new-window -n "goseq" "g s fd"
#--------------Styles---------------

set-option -g pane-active-border-style fg=colour234
set-option -g pane-border-style fg=colour234
set -g status-bg darkgrey
set -wg mode-style bg=darkgrey,fg=black
set -wg mode-style "bg=colour234,fg=white"

set -g status-style "fg=#665c54"
set -g status-bg default
set -g status-position top
set -g status-interval 1
set -g status-left ""
set -g status-right ""
set -g status on

#--------------Plugins---------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-boot 'on'
run '~/.tmux/plugins/tpm/tpm'
