#--------------Base setup---------------
setw -g mouse on
setw -g mode-keys vi
set -g status-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set-option -g set-clipboard on
set-window-option -g automatic-rename on
set-option -g set-titles on
set-option -g renumber-windows on
set-option -g bell-action none
set-option -g visual-bell off
set -g history-limit 10000
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
setw -g monitor-activity off
set -sg escape-time 0

#---------------Rebinds---------------
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind -n M-c select-pane -D
# Reload tmux config
bind r source-file ~/.tmux.conf
bind x kill-pane
bind-key -n M-e command-prompt -p "Enter command:" "new-window '%%'"
bind-key e new-window -n  "bash" "$HOME/.junk/sessionaizer.sh"
# Reload tmux config
#--------------Styles---------------
set-option -g pane-border-style fg=colour234
set -wg mode-style "bg=colour234,fg=white"
set -g status-style "fg=colour234"
set -g status-bg default
set -g status-position top
set -g status-interval 1
set -g status-left " "
set -g status-right ""
set -g status on
set-option -g pane-active-border-style "fg=colour234"
setw -g window-status-format "#[fg=#665c54]#W"
setw -g window-status-current-format "#[fg=#d5c4a1,bold]#W"
